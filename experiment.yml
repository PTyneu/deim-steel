# The only file to edit. Then:  bash train.sh   (or: python tools/steel/prepare_experiment.py experiment.yml --train)
# Relative paths are relative to this file. Values reproduce the DEIMv2-X 800x128 SGD run of the steel study.

name: deimv2_x_800x128_sgd          # run folder: <output_root>/<name>/
model: x                            # s | m | l | x   (DEIMv2 with DINOv3-based backbones)
weights: auto                       # auto = weights/deimv2_dinov3_<model>_coco.pth (bash scripts/download_weights.sh)
                                    # or a path to a DEIMv2 checkpoint / an earlier best.pth;
                                    # none = start from the backbone only (ckpts/, needs --backbone download)
output_root: outputs                # results: outputs/<name>/best.pth, metrics.csv, metrics.png, log.txt, train.log

data:
  format: csv                       # csv | coco
  # csv, one row per box: image_path (absolute), instance_label (string), bbox_x_tl, bbox_y_tl, bbox_x_br,
  #   bbox_y_br (pixels of the original image), split (train | val | test). test is kept: evaluate.py --split test.
  #   Empty label / bbox = image without boxes. Converted once to data_cache/<name>/ (again when the CSV changes).
  #   The legacy steel CSV (ImageId, ClassId, x_min, ..., split) is detected by its header and needs `images`.
  csv: ../steel-defect-detection/train_bboxes.csv
  images: ../steel-defect-detection/train_images   # optional: only for relative image_path or the legacy CSV
  class_merge: {6: 1, 5: 3}         # old label -> new label, e.g. {scratch_small: scratch}; {} keeps all classes
  # coco: category ids are remapped to 0..K-1 automatically when needed
  # train_images: path/to/train_images
  # train_ann: path/to/train.json
  # val_images: path/to/val_images
  # val_ann: path/to/val.json

input_size: [128, 800]              # [h, w], multiples of 32; 1600x256 strips -> 800x128 keeps the aspect ratio
epochs: 12
batch_size: 20                      # 800x128, DEIMv2-X: ~12 GB on a 16 GB card; 24 spills into system RAM on Windows
val_batch_size: 16
workers: 4                          # data loader processes per GPU
devices: [0]                        # GPU ids as nvidia-smi shows them; several = DDP on this machine, e.g. [0, 1, 2, 3]
                                    # batch_size / val_batch_size are totals over all GPUs (per GPU: batch_size / N)

optimizer: sgd                      # sgd | adamw
lr: auto                            # head lr. auto: sgd 0.01, adamw = model recipe scaled to batch_size
backbone_lr_ratio: auto             # backbone lr = lr * ratio. auto: sgd 0.02, adamw = recipe ratio (e.g. X: 0.02)
weight_decay: auto                  # auto: sgd 1e-4, adamw = recipe (1.25e-4)

mosaic: auto                        # auto: on for square input_size, off for rectangular (Mosaic is square-only)
multiscale: false                   # square inputs only
amp: true
seed: 0

best_metric: map50                  # map50 | map (AP50:95) - which metric selects best.pth
save_best_only: true                # run folder keeps only best.pth (internal checkpoints are removed after training)
