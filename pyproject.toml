[project]
name = "deim-steel"
version = "0.1.0"
description = "DEIMv2 fine-tuning for steel surface defects: one experiment.yml, weight download, best-only checkpoints, per-epoch metrics"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # CUDA 12.8 builds (see [tool.uv.sources]); RTX 50xx needs torch >= 2.7
    "torch==2.7.1",
    "torchvision==0.22.1",
    "faster-coco-eval>=1.6.7",
    "pyyaml",
    "tensorboard",
    "scipy",
    "calflops",
    "transformers",
    "pillow",
    "matplotlib",
    "pandas>=2,<3",        # tools/steel/infer.py returns a DataFrame; <3: Windows Smart App Control blocked a 3.0.6 DLL
    "gdown",               # DEIMv2 checkpoints / ViT-Tiny backbones from Google Drive
    "huggingface-hub",
    "safetensors",         # DEIMv2 checkpoints from the Hugging Face Hub (--source hf)
    "timm>=1.0.30",        # DINOv3 ViT-S / ViT-S+ backbones (converted by tools/steel/download_weights.py)
]

[tool.uv]
package = false            # scripts run from the repo root: train.py, tools/steel/*, *.sh
environments = ["sys_platform == 'win32'", "sys_platform == 'linux'"]  # the cu128 index has no macOS wheels

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]
torchvision = [{ index = "pytorch-cu128" }]
